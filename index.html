<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrameForge — Vector Animation Studio</title>
<style>
:root{--bg:#111318;--panel:#191c23;--panel2:#20242d;--line:#2b303b;--muted:#9299a8;--text:#edf0f6;--accent:#8c72ff;--accent2:#af9cff;--green:#68d5b0;--danger:#ff707c;--top:54px;--tl:142px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 10px;transition:.15s}button:hover{background:#2a2f3b;border-color:#454b5a}button.active{background:#312957;border-color:var(--accent);color:#ddd5ff}.topbar{height:var(--top);background:#171920;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:12px;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:14px;letter-spacing:.2px;white-space:nowrap}.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#a991ff,#6552db);display:grid;place-items:center;box-shadow:0 4px 14px #8c72ff44}.logo svg{width:17px;height:17px}.separator{height:24px;border-left:1px solid var(--line);margin:0 2px}.top-actions{display:flex;gap:6px;align-items:center}.top-actions button{padding:6px 9px}.docname{border:0;background:transparent;font-weight:600;width:150px;padding:5px 7px}.spacer{flex:1}.status{color:var(--muted);font-size:11px}.workspace{height:calc(100vh - var(--top) - var(--tl));display:grid;grid-template-columns:54px 1fr 250px;min-height:260px}.toolbar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:5px}.tool{width:38px;height:38px;padding:0;border:1px solid transparent;background:transparent;color:#aeb4c2;display:grid;place-items:center;border-radius:8px}.tool svg{width:18px;height:18px;stroke:currentColor}.tool.active{background:#312957;color:#c8baff;border-color:#5947a1}.tool:hover{background:#262a34}.tool-sep{width:25px;border-top:1px solid var(--line);margin:4px 0}.stage-area{position:relative;overflow:hidden;background-color:#14161c;background-image:radial-gradient(#292d36 .8px,transparent .8px);background-size:18px 18px;display:grid;place-items:center}.stage-wrap{position:relative;box-shadow:0 18px 55px #0009,0 0 0 1px #ffffff16;max-width:92%;max-height:88%;}.stage-wrap svg{display:block;background:#fff;touch-action:none;user-select:none}.stage-wrap svg text{user-select:none}.stage-label{position:absolute;bottom:calc(100% + 9px);left:0;color:#9299a8;font-size:11px;letter-spacing:.2px}.zoom-controls{position:absolute;bottom:13px;left:14px;display:flex;align-items:center;gap:5px;background:#1b1e25eF;padding:5px;border:1px solid var(--line);border-radius:9px}.zoom-controls button{padding:3px 8px;border:0;background:transparent}.zoom-val{min-width:42px;text-align:center;color:#c2c7d1;font-size:11px}.hint{position:absolute;bottom:16px;right:16px;color:#7f8694;font-size:11px}.inspector{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:0 13px 20px}.panel-title{height:43px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:12px;border-bottom:1px solid var(--line);margin-bottom:12px}.section{margin:0 0 16px}.section-head{font-size:10px;color:#9299a8;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:13px 0 9px}.field-row{display:flex;align-items:center;gap:8px;margin:8px 0}.field-row label{color:#a5abb8;min-width:55px;font-size:11px}.field-row input[type=color]{width:32px;height:27px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:2px}.field-row input[type=number],.field-row input[type=text],.field-row select{height:29px;background:#12151a;border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:0;flex:1}.checkline{display:flex;align-items:center;gap:7px;color:#a5abb8;font-size:11px}.checkline input{accent-color:var(--accent)}.empty-state{padding:14px 2px;color:#838a99;font-size:11px;line-height:1.6}.swatches{display:flex;gap:6px}.swatch{width:19px;height:19px;border-radius:5px;border:1px solid #ffffff30;cursor:pointer}.layers{display:flex;flex-direction:column;gap:4px}.layer{display:flex;align-items:center;gap:7px;padding:7px;border-radius:6px;background:#20242d;font-size:11px;cursor:pointer;border:1px solid transparent}.layer.selected{border-color:#7760df;background:#2d2845}.layer .eye{color:#a0a7b5;background:none;border:0;padding:1px;font-size:13px}.layer-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.layer-type{font-size:9px;color:#737b8b;text-transform:uppercase}.timeline{height:var(--tl);background:#181a21;border-top:1px solid var(--line);display:grid;grid-template-rows:39px 1fr}.timeline-head{display:flex;align-items:center;padding:0 13px;gap:8px;border-bottom:1px solid var(--line)}.timeline-head strong{font-size:11px}.timeline-head button{padding:4px 8px}.timeline-body{display:grid;grid-template-columns:175px 1fr;overflow:hidden}.track-label{padding:10px 12px;border-right:1px solid var(--line);font-size:11px;color:#a5abb8}.track-label small{display:block;color:#6e7685;margin-top:5px}.frames-scroller{overflow:auto;position:relative}.frames{display:grid;grid-auto-flow:column;grid-auto-columns:34px;height:100%;align-content:start;min-width:max-content}.frame{height:60px;border-right:1px solid #292d36;border-bottom:1px solid #292d36;position:relative;cursor:pointer}.frame:nth-child(5n+1){border-left:1px solid #292d36}.frame-num{position:absolute;top:5px;left:5px;font-size:9px;color:#717989}.frame-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#7661db;left:50%;top:33px;transform:translateX(-50%);box-shadow:0 0 7px #7661db66}.frame.key{background:#242431}.frame.current{outline:2px solid #a48fff;outline-offset:-2px;background:#302a45;z-index:1}.timeline-controls{display:flex;gap:5px}.timeline-controls button{width:25px;height:25px;padding:0}.onion{color:#a7aebc;font-size:11px;display:flex;align-items:center;gap:5px;margin-left:6px}.toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);background:#292d37;border:1px solid #424958;border-radius:8px;padding:8px 13px;box-shadow:0 8px 25px #0008;z-index:15;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.file-input{display:none}.modal-back{position:fixed;inset:0;background:#0009;display:none;z-index:20;place-items:center}.modal{width:320px;background:#1b1e25;border:1px solid #3b414e;border-radius:12px;padding:18px;box-shadow:0 20px 70px #000a}.modal h3{margin:0 0 14px;font-size:15px}.modal input{width:100%;padding:8px;background:#11141a;border:1px solid var(--line);border-radius:6px;margin-bottom:12px}.modal-actions{display:flex;justify-content:flex-end;gap:7px}
@media(max-width:800px){.workspace{grid-template-columns:48px 1fr 205px}.timeline-body{grid-template-columns:120px 1fr}.docname{width:105px}.hint{display:none}.status{display:none}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M4 17 12 4l8 13H4Z"/><path d="m9 17 3-5 3 5"/></svg></span>FrameForge</div>
 <div class="separator"></div><input id="docname" class="docname" value="Untitled animation" title="Document name">
 <div class="separator"></div><div class="top-actions"><button id="undoBtn" title="Undo (Ctrl+Z)">↶</button><button id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button><button id="duplicateBtn" title="Duplicate selected">▢</button><button id="deleteBtn" title="Delete selected">⌫</button></div>
 <div class="spacer"></div><span id="status" class="status">All changes saved locally</span><div class="top-actions"><button id="newBtn">＋ New</button><button id="openBtn">Open</button><button id="saveBtn">Save project</button><button id="exportBtn" class="active">Export</button></div>
</header>
<div class="workspace">
 <aside class="toolbar" title="Tools">
  <button class="tool active" data-tool="select" title="Select (V)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m5 3 14 11-7 1-3 6L5 3Z"/></svg></button>
  <button class="tool" data-tool="pen" title="Freehand (P)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 17c3-10 7 4 10-5s5-1 6-5"/><path d="m4 17-1 4 4-1"/></svg></button>
  <div class="tool-sep"></div>
  <button class="tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button>
  <button class="tool" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><ellipse cx="12" cy="12" rx="8" ry="7"/></svg></button>
  <button class="tool" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M5 19 19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg></button>
  <button class="tool" id="textTool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 6V4h16v2M12 4v16m-4 0h8"/></svg></button>
  <div class="tool-sep"></div>
  <button class="tool" id="handTool" title="Pan stage (hold Space)" data-tool="hand"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M8 11V5a2 2 0 0 1 4 0v5-7a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1c-2 0-3-.8-4-2l-4-5a2 2 0 0 1 3-3l2 2"/></svg></button>
 </aside>
 <main class="stage-area" id="stageArea">
  <div class="stage-wrap" id="stageWrap"><div class="stage-label">STAGE · 800 × 450</div><svg id="stage" xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450"><rect id="background" x="0" y="0" width="800" height="450" fill="#ffffff" pointer-events="all"/><g id="objects"></g><g id="overlay" pointer-events="none"></g></svg></div>
  <div class="zoom-controls"><button id="zoomOut">−</button><span id="zoomVal" class="zoom-val">100%</span><button id="zoomIn">＋</button><button id="fitBtn">Fit</button></div><div class="hint">V select · drag to draw · Delete to remove</div>
 </main>
 <aside class="inspector">
  <div class="panel-title"><span>Properties</span><span id="selectionLabel" style="font-weight:500;color:#868e9d;font-size:10px">No selection</span></div>
  <div class="section"><div class="section-head">Appearance</div>
   <div class="field-row"><label>Fill</label><input id="fillColor" type="color" value="#8c72ff"><label style="min-width:auto;margin-left:5px">Stroke</label><input id="strokeColor" type="color" value="#272335"></div>
   <div class="field-row"><label>Stroke width</label><input id="strokeWidth" type="number" value="2" min="0" max="40" step="0.5"></div>
   <div class="swatches"><span class="swatch" data-color="#8c72ff" style="background:#8c72ff"></span><span class="swatch" data-color="#ff7188" style="background:#ff7188"></span><span class="swatch" data-color="#ffbf69" style="background:#ffbf69"></span><span class="swatch" data-color="#62d6b0" style="background:#62d6b0"></span><span class="swatch" data-color="#54a8ff" style="background:#54a8ff"></span><span class="swatch" data-color="#24242b" style="background:#24242b"></span><span class="swatch" data-color="#ffffff" style="background:#fff"></span></div>
  </div>
  <div class="section"><div class="section-head">Transform</div><div class="field-row"><label>X</label><input type="number" id="propX" placeholder="—"><label style="min-width:15px">Y</label><input type="number" id="propY" placeholder="—"></div><div class="field-row"><label>Width</label><input type="number" id="propW" placeholder="—"><label style="min-width:15px">H</label><input type="number" id="propH" placeholder="—"></div></div>
  <div class="section"><div class="section-head">Stage</div><div class="field-row"><label>Background</label><input type="color" id="bgColor" value="#ffffff"></div><div class="field-row"><label>Size</label><input type="number" id="stageW" value="800" min="100" max="3000"><span style="color:#777">×</span><input type="number" id="stageH" value="450" min="100" max="3000"></div><button id="resizeStage" style="width:100%;margin-top:2px">Resize stage</button></div>
  <div class="section"><div class="section-head">Layers <span id="layerCount" style="float:right;color:#676e7d">0</span></div><div id="layers" class="layers"></div><div id="layerEmpty" class="empty-state">Draw something to create your first layer.</div></div>
 </aside>
</div>
<section class="timeline">
 <div class="timeline-head"><strong>Timeline</strong><span style="color:#687080;font-size:10px">SCENE 1</span><div class="separator" style="height:18px"></div><div class="timeline-controls"><button id="playBtn" title="Play / Pause">▶</button><button id="prevFrame" title="Previous frame">◂</button><button id="nextFrame" title="Next frame">▸</button></div><button id="addFrame" title="Insert keyframe (F6)">＋ Keyframe</button><button id="deleteFrame" title="Remove current keyframe">− Frame</button><label class="onion"><input type="checkbox" id="onionToggle"> Onion skin</label><div class="spacer"></div><span style="font-size:10px;color:#777f8e">24 fps</span></div>
 <div class="timeline-body"><div class="track-label">Scene 1<small id="frameReadout">Frame 1 · 24 fps</small></div><div class="frames-scroller" id="framesScroller"><div id="frames" class="frames"></div></div></div>
</section>
<div class="toast" id="toast"></div><input type="file" id="loadInput" class="file-input" accept=".json,application/json">
<div class="modal-back" id="textModal"><div class="modal"><h3>Add text</h3><input id="textValue" placeholder="Type something…" value="Hello, world!"><div class="modal-actions"><button id="cancelText">Cancel</button><button id="confirmText" class="active">Add text</button></div></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], svgNS='http://www.w3.org/2000/svg';
const stage=$('#stage'), objects=$('#objects'), overlay=$('#overlay'), framesEl=$('#frames');
let tool='select', selected=null, drawing=null, moving=null, zoom=1, space=false, playing=false, playTimer=null, currentFrame=1, totalFrames=24;
let frameData={1:[]}, undoStack=[], redoStack=[];
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function el(tag,attrs={}){let e=document.createElementNS(svgNS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function snapshot(){return objects.innerHTML}
function saveHistory(){undoStack.push({html:snapshot(),frames:JSON.stringify(frameData),frame:currentFrame});if(undoStack.length>70)undoStack.shift();redoStack=[];$('#status').textContent='Editing…';setTimeout(()=>$('#status').textContent='All changes saved locally',1200)}
function recordFrame(){frameData[currentFrame]=[...objects.children].map(n=>n.outerHTML);renderTimeline()}
function applyFrame(n){currentFrame=Math.min(Math.max(1,n),totalFrames);objects.innerHTML=(frameData[currentFrame]||[]).join('');selected=null;refreshLayers();refreshInspector();renderTimeline();$('#frameReadout').textContent=`Frame ${currentFrame} · 24 fps`;}
function renderTimeline(){framesEl.innerHTML='';for(let i=1;i<=totalFrames;i++){let f=document.createElement('div');f.className='frame'+(frameData[i]?' key':'')+(i===currentFrame?' current':'');f.innerHTML=`<span class="frame-num">${i}</span>${frameData[i]?'<i class="frame-dot"></i>':''}`;f.onclick=()=>{recordFrame();applyFrame(i)};framesEl.append(f)}let cur=framesEl.children[currentFrame-1];if(cur)cur.scrollIntoView({block:'nearest',inline:'nearest'})}
function updateSelected(){overlay.innerHTML='';if(!selected||!objects.contains(selected))return;let b=selected.getBBox();let r=el('rect',{x:b.x-4,y:b.y-4,width:b.width+8,height:b.height+8,fill:'none',stroke:'#8c72ff','stroke-width':1.5,'stroke-dasharray':'4 3','vector-effect':'non-scaling-stroke'});overlay.append(r);}
function selectNode(node){selected=node;updateSelected();refreshLayers();refreshInspector()}
function refreshLayers(){let list=$('#layers');list.innerHTML='';let nodes=[...objects.children].reverse();$('#layerCount').textContent=nodes.length;$('#layerEmpty').style.display=nodes.length?'none':'block';nodes.forEach((n,i)=>{let d=document.createElement('div');d.className='layer'+(n===selected?' selected':'');let type=n.tagName.toLowerCase();d.innerHTML=`<button class="eye" title="Toggle visibility">◉</button><span class="layer-name">${n.dataset.name||type+' '+(nodes.length-i)}</span><span class="layer-type">${type}</span>`;d.onclick=e=>{if(e.target.classList.contains('eye')){n.style.display=n.style.display==='none'?'':'none';saveHistory();recordFrame();return}selectNode(n)};list.append(d)})}
function getBBoxAttrs(node){let b=node.getBBox();return b}
function refreshInspector(){let yes=!!selected&&objects.contains(selected);$('#selectionLabel').textContent=yes?(selected.dataset.name||selected.tagName.toLowerCase()):'No selection';if(!yes){['propX','propY','propW','propH'].forEach(id=>$('#'+id).value='');return}let b=selected.getBBox();$('#propX').value=Math.round(b.x);$('#propY').value=Math.round(b.y);$('#propW').value=Math.round(b.width);$('#propH').value=Math.round(b.height);let fill=selected.getAttribute('fill');if(fill&&/^#[0-9a-f]{6}$/i.test(fill))$('#fillColor').value=fill;let stroke=selected.getAttribute('stroke');if(stroke&&/^#[0-9a-f]{6}$/i.test(stroke))$('#strokeColor').value=stroke;$('#strokeWidth').value=selected.getAttribute('stroke-width')||2}
function point(evt){let p=stage.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(stage.getScreenCTM().inverse())}
function setTool(t){tool=t;$$('.tool[data-tool]').forEach(x=>x.classList.toggle('active',x.dataset.tool===t));stage.style.cursor=t==='select'?'default':t==='hand'?'grab':'crosshair'}
function addNode(node){node.dataset.id=uid();node.dataset.name=node.dataset.name||node.tagName.toLowerCase()+' '+(objects.children.length+1);objects.append(node);selectNode(node);saveHistory();recordFrame()}
function styleNode(n){n.setAttribute('fill',$('#fillColor').value);n.setAttribute('stroke',$('#strokeColor').value);n.setAttribute('stroke-width',$('#strokeWidth').value||2);n.setAttribute('stroke-linecap','round');n.setAttribute('stroke-linejoin','round')}
function drawStart(evt){if(evt.button!==0)return;let p=point(evt);if(tool==='select'){let node=evt.target.closest('[data-id]');if(node&&objects.contains(node)){selectNode(node);moving={node,start:p,orig:node.getAttribute('transform')||'',changed:false};stage.setPointerCapture(evt.pointerId)}else{selectNode(null)}return}
 if(tool==='text'){openText(p);return} if(tool==='hand'){moving={pan:true,x:evt.clientX,y:evt.clientY};return}
 drawing={tool,start:p,node:null};let n;if(tool==='rect'){n=el('rect',{x:p.x,y:p.y,width:0,height:0,rx:0})}else if(tool==='ellipse'){n=el('ellipse',{cx:p.x,cy:p.y,rx:0,ry:0})}else if(tool==='line'){n=el('line',{x1:p.x,y1:p.y,x2:p.x,y2:p.y,fill:'none'})}else if(tool==='pen'){n=el('path',{d:`M ${p.x} ${p.y}`,fill:'none'})}if(n){styleNode(n);objects.append(n);drawing.node=n;stage.setPointerCapture(evt.pointerId)}}
function drawMove(evt){let p=point(evt);if(moving?.pan){let w=$('#stageWrap');w.style.transform=`translate(${(moving.tx||0)+evt.clientX-moving.x}px,${(moving.ty||0)+evt.clientY-moving.y}px)`;return}if(moving&&moving.node){let dx=p.x-moving.start.x,dy=p.y-moving.start.y;moving.node.setAttribute('transform',`${moving.orig} translate(${dx} ${dy})`.trim());moving.changed=true;updateSelected();refreshInspector();return}if(!drawing)return;let {start,node,tool:t}=drawing;if(t==='rect'){node.setAttribute('x',Math.min(start.x,p.x));node.setAttribute('y',Math.min(start.y,p.y));node.setAttribute('width',Math.abs(p.x-start.x));node.setAttribute('height',Math.abs(p.y-start.y))}else if(t==='ellipse'){node.setAttribute('cx',(start.x+p.x)/2);node.setAttribute('cy',(start.y+p.y)/2);node.setAttribute('rx',Math.abs(p.x-start.x)/2);node.setAttribute('ry',Math.abs(p.y-start.y)/2)}else if(t==='line'){node.setAttribute('x2',p.x);node.setAttribute('y2',p.y)}else if(t==='pen'){node.setAttribute('d',node.getAttribute('d')+` L ${p.x} ${p.y}`)}}
function drawEnd(evt){if(moving){if(moving.pan){moving=null;return}if(moving.changed){saveHistory();recordFrame()}moving=null;return}if(!drawing)return;let n=drawing.node;drawing=null;if(!n)return;let b=n.getBBox();if(b.width<2&&b.height<2){n.remove();return}selectNode(n);saveHistory();recordFrame()}
stage.addEventListener('pointerdown',drawStart);stage.addEventListener('pointermove',drawMove);stage.addEventListener('pointerup',drawEnd);stage.addEventListener('pointercancel',drawEnd);
function openText(p){$('#textModal').style.display='grid';$('#textValue').focus();$('#confirmText').onclick=()=>{let txt=$('#textValue').value;if(txt){let n=el('text',{x:p.x,y:p.y,fill:$('#fillColor').value,stroke:$('#strokeColor').value,'stroke-width':0,'font-family':'Inter, Arial, sans-serif','font-size':32});n.textContent=txt;n.dataset.name=txt.slice(0,18);objects.append(n);selectNode(n);saveHistory();recordFrame()}$('#textModal').style.display='none'};$('#cancelText').onclick=()=>$('#textModal').style.display='none'}
$$('.tool[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('#fillColor').oninput=()=>{if(selected){selected.setAttribute('fill',$('#fillColor').value);saveHistory();recordFrame()}};$('#strokeColor').oninput=()=>{if(selected){selected.setAttribute('stroke',$('#strokeColor').value);saveHistory();recordFrame()}};$('#strokeWidth').onchange=()=>{if(selected){selected.setAttribute('stroke-width',$('#strokeWidth').value);saveHistory();recordFrame()}};
$$('.swatch').forEach(s=>s.onclick=()=>{if(selected){$('#fillColor').value=s.dataset.color;selected.setAttribute('fill',s.dataset.color);saveHistory();recordFrame()}});
$('#bgColor').oninput=()=>{$('#background').setAttribute('fill',$('#bgColor').value);saveHistory();recordFrame()};
function transformProp(which,val){if(!selected)return;let b=selected.getBBox();let x=Number($('#propX').value)||0,y=Number($('#propY').value)||0,w=Number($('#propW').value)||b.width,h=Number($('#propH').value)||b.height;if(which==='x'||which==='y'){let dx=which==='x'?x-b.x:0,dy=which==='y'?y-b.y:0;let old=selected.getAttribute('transform')||'';selected.setAttribute('transform',`${old} translate(${dx} ${dy})`.trim())}else if(which==='w'||which==='h'){let sx=which==='w'?w/b.width:1,sy=which==='h'?h/b.height:1;selected.setAttribute('transform',`${selected.getAttribute('transform')||''} translate(${b.x} ${b.y}) scale(${sx} ${sy}) translate(${-b.x} ${-b.y})`.trim())}updateSelected();saveHistory();recordFrame();refreshInspector()}
[['propX','x'],['propY','y'],['propW','w'],['propH','h']].forEach(([id,key])=>$('#'+id).onchange=()=>transformProp(key));
function deleteSelected(){if(selected){selected.remove();selected=null;updateSelected();refreshLayers();refreshInspector();saveHistory();recordFrame()}}
function duplicate(){if(!selected)return;let n=selected.cloneNode(true);n.dataset.id=uid();n.dataset.name=(selected.dataset.name||'Shape')+' copy';let tr=n.getAttribute('transform')||'';n.setAttribute('transform',`${tr} translate(12 12)`.trim());objects.append(n);selectNode(n);saveHistory();recordFrame()}
$('#deleteBtn').onclick=deleteSelected;$('#duplicateBtn').onclick=duplicate;
$('#undoBtn').onclick=()=>{if(!undoStack.length)return;redoStack.push({html:snapshot(),frames:JSON.stringify(frameData),frame:currentFrame});let s=undoStack.pop();objects.innerHTML=s.html;frameData=JSON.parse(s.frames);currentFrame=s.frame;selected=null;refreshLayers();refreshInspector();updateSelected();renderTimeline();toast('Undo')};$('#redoBtn').onclick=()=>{if(!redoStack.length)return;undoStack.push({html:snapshot(),frames:JSON.stringify(frameData),frame:currentFrame});let s=redoStack.pop();objects.innerHTML=s.html;frameData=JSON.parse(s.frames);currentFrame=s.frame;selected=null;refreshLayers();refreshInspector();renderTimeline();toast('Redo')};
function setZoom(z){zoom=Math.max(.25,Math.min(2,z));$('#stageWrap').style.width=(800*zoom)+'px';$('#stageWrap').style.height=(450*zoom)+'px';stage.style.width=(800*zoom)+'px';stage.style.height=(450*zoom)+'px';$('#zoomVal').textContent=Math.round(zoom*100)+'%'}$('#zoomIn').onclick=()=>setZoom(zoom+.1);$('#zoomOut').onclick=()=>setZoom(zoom-.1);$('#fitBtn').onclick=()=>{let a=$('#stageArea');setZoom(Math.min((a.clientWidth-100)/Number(stage.getAttribute('width')),(a.clientHeight-100)/Number(stage.getAttribute('height')),1))};
$('#resizeStage').onclick=()=>{let w=Math.max(100,Math.min(3000,+$('#stageW').value||800)),h=Math.max(100,Math.min(3000,+$('#stageH').value||450));stage.setAttribute('width',w);stage.setAttribute('height',h);stage.setAttribute('viewBox',`0 0 ${w} ${h}`);$('#background').setAttribute('width',w);$('#background').setAttribute('height',h);$('.stage-label').textContent=`STAGE · ${w} × ${h}`;setZoom(Math.min(1,($('#stageArea').clientWidth-100)/w,($('#stageArea').clientHeight-100)/h));saveHistory();toast('Stage resized')};
$('#addFrame').onclick=()=>{recordFrame();let n=currentFrame+1;if(n>totalFrames)totalFrames=n;frameData[n]=JSON.parse(JSON.stringify(frameData[currentFrame]||[]));applyFrame(n);saveHistory();toast('Keyframe inserted')};$('#deleteFrame').onclick=()=>{if(currentFrame===1){toast('Frame 1 cannot be removed');return}delete frameData[currentFrame];let n=currentFrame-1;totalFrames=Math.max(1,totalFrames-1);applyFrame(n);toast('Frame removed')};$('#prevFrame').onclick=()=>{recordFrame();applyFrame(Math.max(1,currentFrame-1))};$('#nextFrame').onclick=()=>{recordFrame();applyFrame(Math.min(totalFrames,currentFrame+1))};
$('#playBtn').onclick=()=>{playing=!playing;$('#playBtn').textContent=playing?'❚❚':'▶';if(playing){playTimer=setInterval(()=>{recordFrame();applyFrame(currentFrame>=totalFrames?1:currentFrame+1)},1000/24)}else clearInterval(playTimer)};
function project(){recordFrame();return {app:'FrameForge',version:1,name:$('#docname').value,width:+stage.getAttribute('width'),height:+stage.getAttribute('height'),background:$('#background').getAttribute('fill'),currentFrame,totalFrames,frameData}}
$('#saveBtn').onclick=()=>{let blob=new Blob([JSON.stringify(project(),null,2)],{type:'application/json'});download(blob,($('#docname').value||'frameforge')+'.ffx.json');toast('Project saved')};$('#openBtn').onclick=()=>$('#loadInput').click();
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
$('#exportBtn').onclick=()=>{let choice=prompt('Export format: SVG or PNG','SVG');if(!choice)return;if(choice.toUpperCase()==='SVG'){let clone=stage.cloneNode(true);clone.setAttribute('xmlns',svgNS);clone.querySelector('#overlay')?.remove();let b=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'});download(b,($('#docname').value||'artwork')+'.svg')}else if(choice.toUpperCase()==='PNG'){let clone=stage.cloneNode(true);clone.querySelector('#overlay')?.remove();let data=new XMLSerializer().serializeToString(clone);let url=URL.createObjectURL(new Blob([data],{type:'image/svg+xml'}));let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=+stage.getAttribute('width');c.height=+stage.getAttribute('height');c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>download(b,($('#docname').value||'artwork')+'.png'));URL.revokeObjectURL(url)};img.src=url}else toast('Choose SVG or PNG')};
$('#newBtn').onclick=()=>{if(confirm('Start a new document? Unsaved work will be replaced.')){objects.innerHTML='';frameData={1:[]};currentFrame=1;totalFrames=24;selected=null;$('#docname').value='Untitled animation';refreshLayers();refreshInspector();renderTimeline();saveHistory()}};
$('#loadInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let p=JSON.parse(await f.text());$('#docname').value=p.name||'Imported';stage.setAttribute('width',p.width||800);stage.setAttribute('height',p.height||450);stage.setAttribute('viewBox',`0 0 ${p.width||800} ${p.height||450}`);$('#background').setAttribute('width',p.width||800);$('#background').setAttribute('height',p.height||450);$('#background').setAttribute('fill',p.background||'#fff');frameData=p.frameData||{1:[]};totalFrames=p.totalFrames||24;applyFrame(p.currentFrame||1);toast('Project loaded')}catch(err){toast('Could not read project file')}e.target.value=''};

window.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.code==='Space'){space=true;setTool('hand');e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('#redoBtn'):$('#undoBtn')).click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('#saveBtn').click()}if(e.key==='Delete'||e.key==='Backspace')deleteSelected();let k=e.key.toLowerCase();if(k==='v')setTool('select');if(k==='p')setTool('pen');if(k==='r')setTool('rect');if(k==='o')setTool('ellipse');if(k==='l')setTool('line');if(k==='t')setTool('text');if(e.key==='F6')$('#addFrame').click()});window.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;setTool('select')}});
$('#stageArea').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?.05:-.05))}},{passive:false});
// Project files can be reopened with the Open button.
renderTimeline();setZoom(1);$('#fitBtn').click();
})();
</script>
</body>
</html>
